name: C++ Build Pipeline (DLL + GUI EXE)

on:
  workflow_dispatch: # Ручний запуск за кнопкою в інтерфейсі GitHub

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Setup Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1

    # Крок 1: Компіляція DLL з папки src/core/
    - name: Compile Core DLL
      shell: cmd
      run: |
        cl.exe /EHsc /O2 /LD /Iinclude src\core\*.cpp /Fe:core.dll /link /DLL

    # Крок 2: Компіляція EXE з папки src/gui/ та лінкування з core.lib
    - name: Compile GUI EXE
      shell: cmd
      run: |
        cl.exe /EHsc /O2 /Iinclude src\gui\*.cpp core.lib /Fe:app.exe /link /SUBSYSTEM:WINDOWS

    # Крок 3: Пакування підсумкового релізу (EXE + DLL)
    - name: Upload Binaries (EXE + DLL)
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-App-Release
        path: |
          app.exe
          core.dll
