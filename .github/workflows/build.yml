name: C++ & Flutter Build Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    # 1. Завантаження коду репозиторію
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Налаштування MSVC
    - name: Setup MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1

    # 3. Встановлення залежностей через манифест vcpkg.json
    - name: Install dependencies via vcpkg
      shell: cmd
      run: |
        "%VCPKG_INSTALLATION_ROOT%\vcpkg.exe" install --triplet x64-windows

    # 4. Компіляція C++ ядра з підключенням LittleCMS
    - name: Compile C++ Engine DLL
      shell: cmd
      run: |
        cl.exe /EHsc /O2 /LD /Iinclude /Ivcpkg_installed\x64-windows\include src\core\*.cpp vcpkg_installed\x64-windows\lib\lcms2.lib /Fe:cmyk_engine.dll

    # 5. Налаштування Flutter SDK
    - name: Set up Flutter SDK
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        architecture: x64

    # 6. Отримання залежностей Flutter
    - name: Install Flutter Dependencies
      run: flutter pub get

    # 7. Збірка Flutter додатка під Windows
    - name: Build Flutter Windows App
      run: flutter build windows --release

    # 8. Копіювання cmyk_engine.dll та бінарників LittleCMS у папку з виконним .exe
    - name: Copy DLLs to Release
      shell: cmd
      run: |
        copy cmyk_engine.dll build\windows\x64\runner\Release\
        if exist vcpkg_installed\x64-windows\bin\lcms2.dll copy vcpkg_installed\x64-windows\bin\lcms2.dll build\windows\x64\runner\Release\

    # 9. Завантаження готової збірки в Artifacts
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Alternative-CMYK-Calculator-Windows
        path: build/windows/x64/runner/Release/
