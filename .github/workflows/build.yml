name: C++ Build Pipeline (DLL + GUI EXE)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Setup Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1

    # Встановлення LittleCMS2 через vcpkg
    - name: Install dependencies via vcpkg
      run: |
        vcpkg install lcms:x64-windows

    # Компіляція DLL з підключенням lcms2
    - name: Compile Core DLL
      shell: cmd
      run: |
        cl.exe /EHsc /O2 /LD /Iinclude /I"%VCPKG_INSTALLATION_ROOT%\installed\x64-windows\include" src\core\*.cpp /Fe:core.dll "%VCPKG_INSTALLATION_ROOT%\installed\x64-windows\lib\lcms2.lib" /link /DLL

    # Компіляція EXE
    - name: Compile GUI EXE
      shell: cmd
      run: |
        cl.exe /EHsc /O2 /Iinclude src\gui\*.cpp core.lib /Fe:app.exe /link /SUBSYSTEM:WINDOWS

    # Пакування готового результату
    - name: Upload Binaries (EXE + DLL)
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-App-Release
        path: |
          app.exe
          core.dll
          %VCPKG_INSTALLATION_ROOT%/installed/x64-windows/bin/lcms2.dll
