name: C++ & Flutter Build Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Тег існуючого релізу, до якого прикріпити збірку (напр. 1.0.0). Порожньо = лише збірка"
        required: false
        default: ""

permissions:
  contents: write   # потрібно лише для публікації Release

env:
  # Папка, де лежать pubspec.yaml і windows/ ("." = корінь репозиторію)
  FLUTTER_PROJECT_DIR: "."
  # Точка входу Flutter відносно FLUTTER_PROJECT_DIR (Flutter за замовчуванням — "lib/main.dart")
  FLUTTER_TARGET: "lib/main.dart"

jobs:
  build:
    runs-on: windows-latest

    steps:
    # 1. Завантаження коду репозиторію
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Налаштування MSVC
    - name: Setup MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1

    # 3. LittleCMS через vcpkg у класичному режимі
    #    (--feature-flags=-manifests ігнорує vcpkg.json, якщо він раптом лежить у корені)
    - name: Install dependencies via vcpkg
      shell: cmd
      run: |
        "%VCPKG_INSTALLATION_ROOT%\vcpkg.exe" install lcms:x64-windows --feature-flags=-manifests || exit /b 1

    # 4. Компіляція C++ ядра в cmyk_engine.dll
    - name: Compile C++ Engine DLL
      shell: cmd
      run: |
        mkdir build_cpp
        cl.exe /nologo /EHsc /std:c++17 /O2 /LD /Iinclude /I"%VCPKG_INSTALLATION_ROOT%\installed\x64-windows\include" src\core\*.cpp "%VCPKG_INSTALLATION_ROOT%\installed\x64-windows\lib\lcms2.lib" /Fo:build_cpp\ /Fe:cmyk_engine.dll || exit /b 1

    # 5. Перевірка, що DLL експортує функції, які викликає Dart FFI
    - name: Verify DLL exports
      shell: cmd
      run: |
        dumpbin /exports cmyk_engine.dll | findstr /C:"engine_create" || exit /b 1
        dumpbin /exports cmyk_engine.dll | findstr /C:"engine_destroy" || exit /b 1
        dumpbin /exports cmyk_engine.dll | findstr /C:"engine_search" || exit /b 1

    # 6. Налаштування Flutter SDK
    - name: Set up Flutter SDK
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        architecture: x64

    # 7. Перевірка структури Flutter-проєкту (зрозуміла помилка замість загадкової)
    - name: Check Flutter project layout
      shell: pwsh
      run: |
        $dir = $env:FLUTTER_PROJECT_DIR
        $missing = @()
        if (-not (Test-Path (Join-Path $dir 'pubspec.yaml'))) { $missing += 'pubspec.yaml' }
        if (-not (Test-Path (Join-Path $dir 'windows'))) { $missing += 'windows/ (створіть: flutter create --platforms=windows .)' }
        if (-not (Test-Path (Join-Path $dir $env:FLUTTER_TARGET))) { $missing += $env:FLUTTER_TARGET }
        if ($missing.Count -gt 0) {
          Write-Error ("У Flutter-проєкті '" + $dir + "' не знайдено: " + ($missing -join ', '))
          exit 1
        }

    # 8. Залежності Flutter
    - name: Install Flutter Dependencies
      working-directory: ${{ env.FLUTTER_PROJECT_DIR }}
      run: flutter pub get

    # 9. Збірка Flutter-додатка під Windows
    - name: Build Flutter Windows App
      working-directory: ${{ env.FLUTTER_PROJECT_DIR }}
      run: flutter build windows --release -t ${{ env.FLUTTER_TARGET }}

    # 10. cmyk_engine.dll і lcms DLL поруч з .exe (з діагностикою)
    - name: Copy DLLs to Release
      shell: pwsh
      run: |
        $rel = Join-Path $env:FLUTTER_PROJECT_DIR 'build/windows/x64/runner/Release'
        Write-Host "Release dir: $rel"
        if (-not (Test-Path $rel)) {
          Write-Host "Release dir not found. Contents of build/windows:"
          Get-ChildItem -Recurse -Depth 4 (Join-Path $env:FLUTTER_PROJECT_DIR 'build/windows') | Select-Object -ExpandProperty FullName
          exit 1
        }
        Copy-Item cmyk_engine.dll $rel -Force
        $bin = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed/x64-windows/bin'
        $lcms = Get-ChildItem $bin -Filter 'lcms*.dll'
        if (-not $lcms) {
          Write-Host "No lcms DLL in $bin. Contents:"
          Get-ChildItem $bin | Select-Object -ExpandProperty Name
          exit 1
        }
        $lcms | ForEach-Object { Copy-Item $_.FullName $rel -Force; Write-Host "Copied $($_.Name)" }
        Write-Host "DLLs in Release:"
        Get-ChildItem $rel -Filter *.dll | Select-Object -ExpandProperty Name

    # 11. Готова збірка в Artifacts
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Alternative-CMYK-Calculator-Windows
        path: ${{ env.FLUTTER_PROJECT_DIR }}/build/windows/x64/runner/Release/

    # 12. Публікація в GitHub Release: за тегом v* або вручну (Run workflow + тег існуючого релізу)
    - name: Resolve release tag
      shell: pwsh
      env:
        EVENT_NAME: ${{ github.event_name }}
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
        INPUT_TAG: ${{ inputs.release_tag }}
      run: |
        $tag = ""
        if ($env:REF_TYPE -eq "tag" -and $env:REF_NAME.StartsWith("v")) { $tag = $env:REF_NAME }
        elseif ($env:EVENT_NAME -eq "workflow_dispatch") { $tag = ($env:INPUT_TAG).Trim() }
        "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        Write-Host "Release tag: '$tag'"

    - name: Zip release
      if: env.RELEASE_TAG != ''
      shell: pwsh
      run: |
        $zip = "Alternative-CMYK-Calculator-$($env:RELEASE_TAG)-windows-x64.zip"
        Compress-Archive -Path "$env:FLUTTER_PROJECT_DIR/build/windows/x64/runner/Release/*" -DestinationPath $zip
        "ZIP_NAME=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

    - name: Publish GitHub Release
      if: env.RELEASE_TAG != ''
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $tag = $env:RELEASE_TAG
        gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
        if ($LASTEXITCODE -eq 0) {
          Write-Host "Release $tag exists: uploading asset"
          gh release upload $tag $env:ZIP_NAME --clobber --repo $env:GITHUB_REPOSITORY
        } else {
          Write-Host "Release $tag not found: creating"
          gh release create $tag $env:ZIP_NAME --title $tag --generate-notes --repo $env:GITHUB_REPOSITORY
        }
        if ($LASTEXITCODE -ne 0) { exit 1 }
