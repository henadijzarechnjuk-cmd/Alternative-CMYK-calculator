name: C++ & Flutter Build Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    # 1. Завантаження коду репозиторію
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Налаштування MSVC для компіляції C++ ядра
    - name: Setup MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1

    # 3. Компіляція C++ ядра у cmyk_engine.dll
    - name: Compile C++ Engine DLL
      shell: cmd
      run: |
        cl.exe /EHsc /O2 /LD /Iinclude src\core\*.cpp /Fe:cmyk_engine.dll

    # 4. Встановлення Flutter SDK (усуває exit code 2)
    - name: Set up Flutter SDK
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        architecture: x64

    # 5. Отримання залежностей Flutter
    - name: Install Flutter Dependencies
      run: flutter pub get

    # 6. Збірка Flutter додатка під Windows
    - name: Build Flutter Windows App
      run: flutter build windows --release

    # 7. Копіювання cmyk_engine.dll у папку з виконним .exe
    - name: Copy C++ DLL to Release
      shell: cmd
      run: |
        copy cmyk_engine.dll build\windows\x64\runner\Release\

    # 8. Завантаження готової збірки в Artifacts
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Alternative-CMYK-Calculator-Windows
        path: build/windows/x64/runner/Release/
